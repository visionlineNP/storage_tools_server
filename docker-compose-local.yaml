services:
  redis:
    image: redis:alpine
    restart: always
    networks:
      - internal

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: sts
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: stsdb
    volumes:
      - pgdata1:/var/lib/postgresql/data
    ports:
      - "5433:5432"     
    restart: always
    networks:
      - internal

  storage_tools_server_backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      network: host    
    image: storage_tools_server_backend
    container_name: storage_tools_server_backend
    expose:
      - "8091"
    environment:
      SERVERNAME:   ${SERVERNAME}
      CONFIG:       ${CONFIG}
      PORT:         ${PORT}
      REDIS_HOST:   redis
      REDIS_URL:    ${REDIS_URL}
      VOLUME_ROOT:  ${VOLUME_ROOT}
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      stsdb
      DB_USER:      sts
      DB_PASSWORD:  mypassword
    depends_on:
      - redis
      - postgres
    volumes:
      - ./config/:/app/config
      - ./config/keys.yaml:/app/config/keys.yaml
      - ${VOLUME_ROOT}:${VOLUME_ROOT}
    tty: true
    stdin_open: true
    restart: always
    networks:
      - internal

  storage_tools_server:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      network: host    
    image: storage_tools_server
    container_name: storage_tools_server
    expose:
      - "8091"
    ports:
      - "8091:8091"     
      - "5353:5353/udp"    # mDNS (zeroconf) discovery
    environment:
      SERVERNAME:  ${SERVERNAME}
      CONFIG:      ${CONFIG}
      PORT:        ${PORT}
      REDIS_HOST:  redis
      REDIS_URL:   ${REDIS_URL}
      VOLUME_ROOT: ${VOLUME_ROOT}
      BACKEND_URL: http://storage_tools_server_backend:8091
    depends_on:
      - redis
      - storage_tools_server_backend
      - postgres
    volumes:
      - ./config/:/app/config
      - ./config/keys.yaml:/app/config/keys.yaml
      - ${VOLUME_ROOT}:${VOLUME_ROOT}
    tty: true
    stdin_open: true
    restart: always
    networks:
      - internal

volumes:
  pgdata1:

networks:
  internal:
    driver: bridge
